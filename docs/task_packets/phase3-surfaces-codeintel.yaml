---
id: phase3-surfaces-codeintel
title: Build TUI, Gateway, ACP surfaces and incremental tag extractor
description: |
  Deliver user-facing surfaces and code-intelligence tooling on top of the agent core:
  * Brick/vty-based Rich TUI speaking JSON-RPC 2.0.
  * Multi-platform Gateway adapter (Telegram, Discord, Slack, HTTP webhooks) via `GatewayEffect`.
  * Agent Client Protocol (ACP) adapter over stdio for Zed/editor integration.
  * Fast code-intelligence tag extraction (`sarutahiko-tags`) emitting ctags-compatible rows.
  All surfaces are thin projections of the agent registry over `yamaarashi-conduit` byte framing
  and `kogaki-wire` JSON-RPC.

dependencies:
  - phase2-agent-core

packages:
  - sarutahiko-tui
  - sarutahiko-gateway
  - sarutahiko-acp
  - sarutahiko-tags

steps:
  - id: create-surface-skeletons
    name: Create surface package skeletons
    action: |
      In packages/sarutahiko/sarutahiko-tui, packages/sarutahiko/sarutahiko-gateway,
         packages/sarutahiko/sarutahiko-acp, packages/sarutahiko/sarutahiko-tags:
      - Create minimal cabal files importing commons.
      - Add dependencies on sarutahiko-agent, sarutahiko-jsonrpc, kogaki-wire,
        yamaarashi-conduit, sarutahiko-effect-signatures.
      - Register in cabal.project and verify clean build.
    duration: "40m"

  - id: implement-tui
    name: Implement Brick-based TUI surface
    action: |
      In packages/sarutahiko/sarutahiko-tui/src/Sarutahiko/TUI.hs:
      - Implement TUI event loop speaking JSON-RPC to the agent core.
      - Maintain session state as a record (`TuiStateRec`).
      - Support streaming token rendering and keypress cancellation.
    duration: "45m"

  - id: implement-gateway
    name: Implement multi-platform gateway
    action: |
      In packages/sarutahiko/sarutahiko-gateway/src/Sarutahiko/Gateway.hs:
      - Define `GatewayEffect` abstracting over chat transports.
      - Implement HTTP webhook and WebSocket interpreters.
      - Resource-bracket client sockets with yamaarashi-conduit.
    duration: "45m"

  - id: implement-acp
    name: Implement Agent Client Protocol for editor integration
    action: |
      In packages/sarutahiko/sarutahiko-acp/src/Sarutahiko/ACP.hs:
      - Implement stdio JSON-RPC adapter forwarding requests to agent core.
      - Support Zed editor handshake and tool calling.
    duration: "30m"

  - id: implement-tags
    name: Implement ctags-compatible scope-stack tag extractor
    action: |
      In packages/sarutahiko/sarutahiko-tags/src/Sarutahiko/Tags.hs:
      - Extract definition, reference, and module tags into row-typed records.
      - Emit JSON lines conforming to universal-ctags output format.
    duration: "45m"

  - id: verify-surfaces
    name: Test suite and surface verification
    action: |
      In packages/sarutahiko/sarutahiko-tui/test, packages/sarutahiko/sarutahiko-gateway/test, packages/sarutahiko/sarutahiko-tags/test:
      - Run JSON-RPC roundtrip tests on all surface adapters.
      - Run tag extractor over sample Haskell and C source trees; verify ctags compatibility.
    duration: "30m"

success_criteria:
  - All Phase 3 packages compile with zero warnings under `-Wall -Werror`.
  - All tests pass via `cabal v2-test sarutahiko-tui sarutahiko-gateway sarutahiko-acp sarutahiko-tags`.
  - Zero-Aeson invariant maintained across all surface protocols.