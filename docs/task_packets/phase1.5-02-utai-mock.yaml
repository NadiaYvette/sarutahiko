---
id: phase1.5-02-utai-mock
title: Implement utai LLM substrate and deterministic mock interpreter
description: |
  Implement `packages/utai` (Noh: 謡), the canonical LLM substrate per
  LLM_SUBSTRATE_DESIGN.md and DECISION-005.

  Components:
  - Neutral `ModelAPI` GADT effect signature in `packages/sarutahiko-effect-signatures`
    covering `Complete`, `Stream`, `Embed`, and `CountTokens`.
  - Open tagless capability typeclass `MonadModelAPI` in `packages/utai` under the Façade Pattern.
  - Wire codecs over `kogaki-wire` (strictly zero-Aeson) for request serialization.
  - Deterministic fixture replay carrier `utai-mock` in `packages/utai/src/Utai/Mock.hs`
    for hermetic, reproducible Phase 1.5 Hokora execution without live network or API keys.
  - Verification test suite enforcing laws L1–L4 (terminator, usage monoid, option honesty,
    error categorization).

dependencies:
  - yamaarashi-05-dogfood-harness

packages:
  - utai

steps:
  - id: create-skeleton
    name: Package skeleton and dependencies setup
    action: |
      In packages/utai/utai:
      - Create utai.cabal importing commons.
      - Add dependencies on large-anon, sarutahiko-records, kogaki-wire,
        sarutahiko-effect-signatures, yamaarashi.
      - Register in cabal.project and verify clean build.
    duration: "30m"

  - id: define-modelapi-signature
    name: Define ModelAPI GADT signature and MonadModelAPI typeclass
    action: |
      In packages/sarutahiko/sarutahiko-effect-signatures/src/Sarutahiko/Effect/ModelAPI.hs
      and packages/utai/utai/src/Utai/Capability.hs:
      - Define request/response row types using large-anon.
      - Define `ModelAPI` GADT signature.
      - Define `MonadModelAPI` typeclass with smart functions (`complete`, `stream`).
    duration: "45m"

  - id: implement-mock-interpreter
    name: Implement deterministic utai-mock carrier
    action: |
      In packages/utai/utai/src/Utai/Mock.hs:
      - Implement fixture replayer matching prompt prefixes to canned responses.
      - Support tool call generation for testing agent tool invocation loops.
      - Implement `runModelAPIMock :: FixtureStore -> Eff (ModelAPI : es) a -> Eff es a`.
    duration: "45m"

  - id: verify-model-laws
    name: Test suite and law verification
    action: |
      In packages/utai/utai/test/Spec.hs:
      - Verify L1 (terminator honesty): streams always finish with valid StopReason.
      - Verify L2 (usage monoid): token counts aggregate associatively.
      - Verify L3 (option honesty): unsupported options fail closed before dispatch.
    duration: "30m"

success_criteria:
  - `utai` compiles with zero warnings under `-Wall -Werror`.
  - All property tests in `utai-test` pass via `cabal v2-test utai`.
  - Zero dependencies on `aeson`.
