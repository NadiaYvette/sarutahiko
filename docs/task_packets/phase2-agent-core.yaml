# keiro task packet – phase‑2‑agent‑core
id: phase2-agent-core
title: Build the full Agent Core (turn loop, tool registry, plugin system, sessions, hooks)
description: |
  Using the extensible‑record + algebraic‑effects foundation established
  in the refactor packets, implement the Hermes‑style agent core:
  * an interpreted ReAct‑style turn program (`Eff es`) that can make
    at most one model call and at most one tool call per turn,
  * a dynamic tool/command/skill/hook registry built from record‑effect
    extensions,
  * session persistence with prompt‑cache‑safe compression,
  * hook system with bounded/fail‑closed semantics,
  * plugin loading/unloading with capability grants and kill‑lists.
  This phase produces the binary `sarutahiko chat` that can replay a
  real Hermes session and load a ported plugin.

dependencies:
  - refactor-effects-records
  - refactor-logical-string

packages:
  - sarutahiko-agent           # packages/agent-core
  - sarutahiko-session         # packages/session
  - sarutahiko-config          # packages/config
  - sarutahiko-hooks           # packages/hooks
  - sarutahiko-plugins         # packages/plugins
  - sarutahiko-model           # packages/model   (utai)
  - sarutahiko-effect-signatures # (already present)
  - sarutahiko-effects-effectful
  - sarutahiko-effects-polysemy
  - yamaarashi                 # streaming kernel
  - hashigakari-core           # for session store (minimal SQLite writer)
  - sarutahiko-log             # structured logging

steps:
  - name: Design turn‑program signature
    action: |
      Define the effect signature for a turn:
        data TurnEffect (es :: [Effect]) where
          ModelAPI   :: ModelAPI :<: es => Eff es Text
          Tools      :: Tools    :<: es => Eff ToolCallId
          SessionStore :: SessionStore :<: es => Eff es ()
          Log        :: Log      :<: es => Eff es ()
          Resource   :: Resource :<: es => Eff es ()
      The turn program will be a value of type `∀ es. (ModelAPI :<: es,
                                                    Tools :<: es,
                                                    SessionStore :<: es,
                                                    Log :<: es,
                                                    Resource :<: es) =>
                                                    Text -> Eff es Text`.
    owner: ${{ github.actor }}
    duration: "1h"

  - name: Implement the interpreted ReAct loop
    action: |
      Write `agentTurn :: Text -> Eff es Text` that:
        1. opens a session (`SessionStore`),
        2. appends the user message,
        3. calls `completeStream` (ModelAPI) → assistant reply,
        4. inspects the reply for a tool request (`wantTool`),
        5. if present, invokes the tool via `Tools` (spawning an MCP subprocess
           over stdio, using yamaarashi framing, Resource‑bracketed),
        6. awaits observation,
        7. calls `completeWithObservation`,
        8. appends assistant + observation messages,
        9. closes the session,
       10. returns final assistant text.
      Use `reader`, `gets`, `modify'`, `trace`, `throwError`,
      `liftIO` for process spawn, and the `Resource` effect for
      bracketing the subprocess.
    owner: ${{ github.actor }}
    duration: "3h"

  - name: Build dynamic tool/command/skill/hook registry
    action: |
      * Define a registry record type:
          type ToolRegistryRec =
            '[ "tools"   := Map ToolName ToolSpec
             , "commands":= Map CmdName CmdSpec
             , "skills"  := Map SkillName SkillSpec
             , "hooks"   := Map HookName HookSpec ]`
      * Provide effect‑sender operations:
          `registerTool :: ToolSpec -> Eff es ()`
          `lookupTool   :: ToolName -> Eff es (Maybe ToolSpec)`
          etc., implemented as `modify' $ \r -> r & #tools %~ Map.insert …`
      * Make the registry a `Reader` effect so that any layer can
        `reader #tools .at name` to look up a tool.
      * Hooks are executed via a `HookDispatch` effect that reads the
        hook record, runs it with a deadline (`timeout`), and fails closed
        on hang.
    owner: ${{ github.actor }}
    duration: "2h"

  - name: Session persistence & prompt‑cache safety
    action: |
      * Use `hashigakari-core` with a minimal SQLite `Stepper` to
        append `SessionOpened`, `MessageAppended`, `ToolInvoked`,
        `ToolObserved`, `SessionClosed` events (spine v0.2 rows).
      * Implement the conversation‑tail reducer (pure fold) that can
        recompute the session state from the event log.
      * Add a compression effect (`Compress`) that, when triggered,
        replaces the current session with a compressed summary
        (additive only, per Hermes invariants).
      * Ensure that mid‑conversation toolset swaps are prohibited
        (the tool registry is read‑only after session start).
    owner: ${{ github.actor }}
    duration: "2h"

  - name: Plugin system (manifest + loading)
    action: |
      * Define a plugin manifest format (YAML) that lists:
          - provided tools/commands/skills/hooks
          - required capabilities (effects)
          - kill‑list, grant‑list, load deadlines
      * At load time, extend the registry record with the plugin’s
        provisions (using record‑extension `<+>`).
      * Apply kill‑lists and grants via the `CapabilityGrant` effect
        (checked before allowing a tool/command to be invoked).
      * Enforce load deadlines with a `Timer` effect that aborts
        loading if the deadline passes.
    owner: ${{ github.actor }}
    duration: "2h"

  - name: Wire up the CLI entry point (`sarutahiko chat`)
    action: |
      * Create an executable that:
          - reads command line arguments (one‑shot mode or REPL),
          - builds an initial config record (defaults ⊕ file ⊕ env ⊕ profile),
          - builds an initial empty session state,
          - runs `agentTurn` under the `effectful` interpreter
            (with `Resource`, `Trace`, `Fail`, `IO` carriers).
      * In REPL mode, loop until `:exit` or EOF, preserving the
        session store across turns.
    owner: ${{ github.actor }}
    duration: "1h"

  - name: Test suite
    action: |
      * Unit tests for each component (turn logic, registry,
        session store, plugin loader) using pure carriers
        (`runState`, `runReader`, `runTracePure`, `runFailEither`).
      * Integration test: start a real MCP subprocess tool (e.g. a
        simple echo tool), run `sarutahiko chat "summarize this file"`,
        verify that the event log contains the expected rows and
        that the final output matches the tool’s result.
      * Replay test: record a session with the real model, delete
        derived state, replay from the event log, and assert byte‑
        identical summary (as per Hokora replay property).
    owner: ${{ github.actor }}
    duration: "3h"

  - name: Benchmark & performance check
    action: |
      Run `cabal bench` for the agent core; ensure that the turn
      loop does not introduce >10% overhead compared to a baseline
      that uses the same effect handlers but without the registry
      indirection.
    owner: ${{ github.actor }}
    duration: "1h"

success_criteria:
  - The `sarutahiko chat` executable builds and runs.
  - It can replay a real Hermes session (provided as a fixture) and
    produce the same final assistant output.
  - A ported Hermes plugin (simple tool) loads successfully,
    appears in the tool registry, and can be invoked via the agent.
  - All unit and integration tests pass.
  - No violation of Hermes invariants (no mid‑conversation toolset
    swaps, compression is the only sanctioned context mutation,
    hook deadlines are respected, kill‑lists honoured).
  - The codebase still compiles after the previous two refactor
    packets (i.e., the changes are additive and do not break existing
    functionality).