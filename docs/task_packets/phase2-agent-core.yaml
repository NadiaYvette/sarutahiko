---
id: phase2-agent-core
title: Build the full Agent Core (turn loop, tool registry, session persistence, hooks)
description: |
  Using the extensible-record + algebraic-effects foundation established in Phase 1
  and proved in Phase 1.5 Hokora, implement the full Hermes-style agent core:
  * Interpreted ReAct-style turn program with bounded iteration and fail-closed termination.
  * Dynamic tool, command, skill, and hook registry built from extensible records.
  * Session persistence backed by `hashigakari-sqlite` with prompt-cache-safe prefix ordering.
  * Hook execution engine with deadline enforcement and fail-closed timeouts.
  * Plugin system with capability grants and kill-lists.
  * Standalone executable `sarutahiko chat` replaying real Hermes sessions.

dependencies:
  - phase1.5-03-hokora-slice

packages:
  - sarutahiko-agent
  - sarutahiko-session
  - sarutahiko-hooks
  - sarutahiko-plugins

steps:
  - id: create-agent-skeletons
    name: Create package skeletons and cabal definitions
    action: |
      In packages/sarutahiko/sarutahiko-agent, packages/sarutahiko/sarutahiko-session,
         packages/sarutahiko/sarutahiko-hooks, packages/sarutahiko/sarutahiko-plugins:
      - Create minimal cabal files importing commons.
      - Add dependencies on utai, hashigakari-sqlite, sarutahiko-records,
        sarutahiko-effect-signatures, yamaarashi-flow.
      - Register in cabal.project and verify clean build.
    duration: "40m"

  - id: implement-turn-engine
    name: Implement interpreted ReAct agent loop
    action: |
      In packages/sarutahiko/sarutahiko-agent/src/Sarutahiko/Agent/Turn.hs:
      - Define `agentTurn :: (MonadModelAPI m, MonadTaskQueue m, MonadEventStore m, MonadProcess m) => Text -> m Text`.
      - Enforce single model call + at most one tool call per turn step.
      - Resource-bracket all tool subprocesses using `typed-process`.
    duration: "45m"

  - id: implement-tool-registry
    name: Build dynamic tool/command/skill/hook registry
    action: |
      In packages/sarutahiko/sarutahiko-agent/src/Sarutahiko/Agent/Registry.hs:
      - Define `ToolRegistryRec` over large-anon extensible records.
      - Implement registration, lookup, and capability permission checking.
    duration: "45m"

  - id: implement-session-engine
    name: Session persistence and prompt-cache safety
    action: |
      In packages/sarutahiko/sarutahiko-session/src/Sarutahiko/Session.hs:
      - Connect to `hashigakari-sqlite` event store.
      - Implement conversation-tail reducer guaranteeing strict prompt-cache prefix preservation.
    duration: "45m"

  - id: implement-hooks-and-plugins
    name: Hook supervisor and capability-bounded plugin loader
    action: |
      In packages/sarutahiko/sarutahiko-hooks and packages/sarutahiko/sarutahiko-plugins:
      - Implement fail-closed hook execution with strict timeouts.
      - Implement plugin manifest loader with capability allowlists and kill-lists.
    duration: "45m"

  - id: implement-agent-core
    name: Test suite and session replay verification
    action: |
      In packages/sarutahiko/sarutahiko-agent/test/Spec.hs:
      - Add property tests verifying turn step bounded execution.
      - Replay recorded Hermes session fixture; verify bit-identical output.
    duration: "30m"

success_criteria:
  - All Phase 2 packages compile with zero warnings under `-Wall -Werror`.
  - All unit and property tests pass via `cabal v2-test sarutahiko-agent`.
  - Session state persists and restores deterministically via SQLite.