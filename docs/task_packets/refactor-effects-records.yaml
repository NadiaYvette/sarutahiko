# keiro task packet – refactor‑effects‑records
id: refactor-effects-records
title: Refactor core libraries to use extensible records + algebraic effects
description: |
  Replace ad‑hoc ReaderT/StateT/ExceptT stacks and manual IORef state with
  the idiomatic `Eff es (Rec r) a` pattern using large‑anon/large‑records
  for configuration/state and effect‑signature GADTs for capabilities.
  The goal is to eliminate Has‑typeclass boilerplate, make the code open
  for extension, and improve testability.

packages:
  - sarutahiko-task-manager   # packages/task-manager
  - sarutahiko-memory-engine  # packages/memory-engine
  - sarutahiko-llm-substrate  # packages/llm-substrate
  - sarutahiko-hokora         # packages/hokora
  - sarutahiko-instruments    # packages/instruments
  - sarutahiko-agent-core     # packages/agent-core
  - sarutahiko-koi-loom       # packages/koi/koi-loom
  - sarutahiko-kogaki-wire    # packages/kogaki-wire   (only the orchestrator layer)
  - sarutahiko-memory-context # packages/memory/context

steps:
  - name: Identify mutable state & capabilities
    action: |
      For each package:
        * List all record‑like data types (config, metrics, counters, etc.).
        * List all effects used (logging, failure, async I/O, process spawning,
          tracing, etc.).
        * Document them in a temporary design note `TMP_REFAC_<pkg>.md`.
    owner: ${{ github.actor }}
    duration: "2h"

  - name: Define extensible record type
    action: |
      Convert each identified state group into a row‑typed record, e.g.
        type WorkerConfRec = '[ "workDir" := FilePath
                            , "maxTries"  := Int
                            , "logger"    := (String -> IO ()) ]
      Use `large-anon`/`large-records` combinators (`<+>`, `emptyRecord`).
    owner: ${{ github.actor }}
    duration: "1h per package"

  - name: Define effect row
    action: |
      Build an effect row that enumerates the needed capabilities:
        type WorkerEffs =
          '[ Reader (Record WorkerConfRec)
           , State (Record '[ "attempts":=Int, "failed":=Bool ])
           , Trace
           , Fail
           , IO ]
      Keep the row open (`++ es`) so callers can add more effects.
    owner: ${{ github.actor }}
    duration: "1h per package"

  - name: Replace monad transformers
    action: |
      Replace custom monads like `newtype AppM a = AppM (ReaderT AppEnv IO a)`
      with a type synonym:
        type WorkerM = Eff WorkerEffs
      Update all function signatures to `WorkerM a` (or more general
      `Member ... es => Eff es a`).
      Use the primitive actions:
        * `reader #field`   – read a config field
        * `gets #field` / `modify' $ \s -> s & #field +~ 1` – state updates
        * `trace msg`       – logging
        * `throwError e`    – failure
        * `liftIO io`       – raw IO (process spawn, file write, etc.)
    owner: ${{ github.actor }}
    duration: "2h per package"

  - name: Provide runner / interpreter
    action: |
      Write a `runWorker`‑style function that supplies concrete carriers:
        runWorker cfg initState logger ioAction =
          runM (runTraceIO logger
                . runState initState
                . runReader cfg
                . runFailEither
                . runIO
                $ workerLogic)
      For tests, swap in pure carriers (`runState`, `runReader`,
      `runTracePure`, `runFailEither`, `runIO` with a mock).
    owner: ${{ github.actor }}
    duration: "1h per package"

  - name: Update test suites
    action: |
      Rewrite unit/tests to use the pure carriers; remove any
      `IORef` construction. Verify that the same behavioural
      assertions pass.
    owner: ${{ github.actor }}
    duration: "1h per package"

  - name: Verify & benchmark
    action: |
      Run the existing test suite (`cabal test`) for each package.
      Check that no regressions appear.
      Optionally run a quick benchmark (`cabal bench`) to ensure
      the refactor does not introduce measurable overhead.
    owner: ${{ github.actor }}
    duration: "30m per package"

success_criteria:
  - All selected packages compile without warnings.
  - All existing tests pass.
  - No manual `IORef` or `Has…` typeclass usage remains in the refactored
    modules (checked via `grep -R "HasConfig\|HasMetrics\|modifyIORef'" src/`).
  - The public API (function names and exposed types) remains unchanged
    except for the addition of the extensible‑record/effect parameters,
    which are backward‑compatible via default values.