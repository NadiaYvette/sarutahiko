id: yamaarashi-group2
title: Implement the rest of the yamaarashi ecosystem (surfaces, protocol layers, data tier, plugin system, tests, docs)
description: >
  Everything needed to turn the thin worker/thick harness into a full‑featured
  coding‑assistant platform: MCP/JSON‑RPC/ACP/gRPC wire layers, surfaces (TUI,
  Gateway, ACP), code‑intelligence (GLR parser, tag extractor), data‑tier
  (hashigakari‑core, syntax, hasql, sqlite, patch, schema, beam, format/codecs),
  plugin manifest system, and comprehensive tests/benchmarks/examples.
steps:
  - name: Add MCP wire layer
    action: Create package `sarutahiko-mcp` implementing the Model Context
      Protocol over stdio/TCP/UnixSocket, using the shared effect signatures.
    owner: '${{ github.actor }}'
    duration: 3h
  - name: Add JSON‑RPC 2.0 wire layer
    action: Create package `sarutahiko-jsonrpc` for lightweight RPC over
      stdio/WebSocket, based on the aeson‑rpc pattern.
    owner: '${{ github.actor }}'
    duration: 2h
  - name: Add ACP/SCIP/gRPC adapters
    action: Create packages `sarutahiko-acp`, `sarutahiko-scip`,
      `sarutahiko-grpc` that expose the same effect‑row services via those
      transports.
    owner: '${{ github.actor }}'
    duration: 4h
  - name: Add TUI surface (brick/vty)
    action: Create package `sarutahiko-surface-tui` with a brick‑based
      interface that talks to the core via MCP/JSON‑RPC.
    owner: '${{ github.actor }}'
    duration: 3h
  - name: Add Gateway surface (Telegram/Discord/Slack/HTTP)
    action: Create package `sarutahiko-surface-gateway` that runs a bot
      or HTTP server and forwards commands to the core.
    owner: '${{ github.actor }}'
    duration: 3h
  - name: Add ACP surface (stdio JSON‑RPC)
    action: Create package `sarutahiko-surface-acp` providing a simple
      stdio‑JSON‑RPC REPL for embedding in editors.
    owner: '${{ github.actor }}'
    duration: 2h
  - name: Add incremental GLR parser
    action: Create package `sarutahiko-parse` with an GLR engine that
      yields partial parse trees and supports online re‑parsing.
    owner: '${{ github.actor }}'
    duration: 4h
  - name: Add tag extractor
    action: Create package `sarutahiko-tags` that extracts symbols,
      comments, and AST tags from source files for code‑intelligence.
    owner: '${{ github.actor }}'
    duration: 2h
  - name: Add hashigakari‑core (row‑typed query AST)
    action: Create package `hashigakari-core` defining the opaque‑row
      query AST, dialect ceiling, and compilation pipeline.
    owner: '${{ github.actor }}'
    duration: 3h
  - name: Add hashigakari‑syntax
    action: Create package `hashigakari-syntax` with parsers for SQL
      DDL/DML that produce the hashigakari‑core AST.
    owner: '${{ github.actor }}'
    duration: 2h
  - name: Add hashigakari‑hasql stepper
    action: Create package `hashigakari-hasql` providing a stepper that
      executes hashigakari queries via Hasql.
    owner: '${{ github.actor }}'
    duration: 2h
  - name: Add hashigakari‑sqlite stepper
    action: Create package `hashigakari-sqlite` providing a stepper that
      executes hashigakari queries via direct‑sqlite.
    owner: '${{ github.actor }}'
    duration: 2h
  - name: Add hashigakari‑patch engine
    action: Create package `hashigakari-patch` implementing the TriState
      patch algorithm for schema migrations.
    owner: '${{ github.actor }}'
    duration: 2h
  - name: Add hashigakari‑schema/migration system
    action: Create package `hashigakari-schema` that stores migrations
      as hashigakari patches and provides apply/rollback.
    owner: '${{ github.actor }}'
    duration: 2h
  - name: Add hashigakari‑beam bridge
    action: Create package `hashigakari-beam` offering Beam‑compatible
      tables and queries built on hashigakari‑core.
    owner: '${{ github.actor }}'
    duration: 2h
  - name: Add hashigakari‑format/codecs
    action: Create package `hashigakari-format` with binary and text
      codecs (FlatBuffers, Cap'n Proto, MessagePack, JSON) for wire
      format of hashigakari rows.
    owner: '${{ github.actor }}'
    duration: 2h
  - name: Add plugin manifest system
    action: Create package `sarutahiko-plugin` that reads YAML manifests,
      extends the capability‑grant effect row, and enforces load deadlines.
    owner: '${{ github.actor }}'
    duration: 2h
  - name: Write comprehensive tests
    action: Add unit, integration, and golden‑tests for each of the above
      packages; ensure property‑based testing where appropriate.
    owner: '${{ github.actor }}'
    duration: 4h
  - name: Add benchmarks
    action: Add cabal benchmarks for streaming throughput, query
      compilation, and plugin‑load latency.
    owner: '${{ github.actor }}'
    duration: 2h
  - name: Write documentation and examples
    action: Produce markdown docs, usage examples, and a quick‑start guide
      showing how to spin up the full stack.
    owner: '${{ github.actor }}'
    duration: 2h
success_criteria:
  - All packages compile and pass their test suites.
  - The full stack (core + surfaces + data‑tier) can be started and
    responds to a simple MCP/JSON‑RPC/ACP command.
  - Code‑intelligence surface shows correct tags and jump‑to‑definition
    for a sample Haskell file.
  - Data‑tier can run a sample migration and query via Hasql and SQLite.
  - Plugin system loads a sample manifest and grants the declared
    capabilities.
  - Benchmarks show reasonable overhead (<20% vs. baseline) for typical
    workloads.