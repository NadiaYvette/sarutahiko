---
id: phase4-data-protocol
title: Build the full hashigakari data tier, protocol-bag codecs, and Dhall row bridge
description: |
  Implement the comprehensive data and protocol layer per HASHIGAKARI_DESIGN.md,
  DECISION-003, and DECISION-004:
  * `hashigakari-core`: Row-typed relational query AST (`Select`, `Projection`, `Where`, `Join`).
  * `hashigakari-syntax`: Dialect-indexed compilation supporting PostgreSQL, SQLite, MySQL,
    MongoDB, Redis, and ODBC compatibility targets.
  * `hashigakari-hasql`: Scaled multi-worker PostgreSQL streaming backend via `hasql` and `Stepper`.
  * `sarutahiko-format-dhall`: Row-typed Dhall bridge (`evalDhallRow`) mapping Dhall's typed records
    directly to `large-anon` rows without rewriting the upstream evaluator.
  * `yamaarashi-streamly`: In-process fused hot-loops for row-typed data processing.

dependencies:
  - phase3-surfaces-codeintel

packages:
  - packages/hashigakari-core
  - packages/hashigakari-syntax
  - packages/hashigakari-hasql
  - packages/sarutahiko-format-dhall

steps:
  - id: create-data-skeletons
    name: Create package skeletons and cabal definitions
    action: |
      In packages/hashigakari-core, packages/hashigakari-syntax,
         packages/hashigakari-hasql, packages/sarutahiko-format-dhall:
      - Create minimal cabal files importing commons.
      - Add dependencies on large-anon, sarutahiko-records, yamaarashi,
        yamaarashi-streamly, sarutahiko-effect-signatures.
      - Register in cabal.project and verify clean build.
    duration: "40m"

  - id: implement-query-ast
    name: Implement row-typed query AST GADTs
    action: |
      In packages/hashigakari-core/src/Hashigakari/Core/AST.hs:
      - Define `Select (r :: [Column])`, `Projection`, `Where`, `Join`.
      - Use `Record (Column f) r` for column descriptors and `TriState` for partial patches.
    duration: "45m"

  - id: implement-dialect-syntax
    name: Implement dialect-indexed SQL compilation
    action: |
      In packages/hashigakari-syntax/src/Hashigakari/Syntax.hs:
      - Implement type-level dialect tags (PostgresDialect, SqliteDialect, MysqlDialect).
      - Guarantee compile-time dialect portability ceilings.
    duration: "45m"

  - id: implement-hasql-backend
    name: Implement Hasql streaming execution
    action: |
      In packages/hashigakari-hasql/src/Hashigakari/Hasql.hs:
      - Implement `HasqlEffect` yielding `Stepper m (Record Identity r)`.
      - Bracket connection pool and statement lifecycles.
    duration: "45m"

  - id: implement-dhall-bridge
    name: Implement Dhall row-typed bridge
    action: |
      In packages/sarutahiko-format-dhall/src/Sarutahiko/Format/Dhall.hs:
      - Implement `evalDhallRow :: Text -> IO (Either DhallError (Record Identity r))`.
      - Bridge Dhall's typed records directly to `large-anon` rows.
    duration: "45m"

  - id: verify-data-tier
    name: Test suite and dialect verification
    action: |
      In packages/hashigakari-core/test, packages/hashigakari-syntax/test, packages/sarutahiko-format-dhall/test:
      - Verify AST compilation across Postgres, SQLite, and MySQL dialects.
      - Verify Dhall configuration files load directly into large-anon rows.
    duration: "30m"

success_criteria:
  - All Phase 4 packages compile with zero warnings under `-Wall -Werror`.
  - All tests pass via `cabal v2-test hashigakari-core hashigakari-syntax sarutahiko-format-dhall`.
  - Dhall row bridge proven with round-trip property tests.